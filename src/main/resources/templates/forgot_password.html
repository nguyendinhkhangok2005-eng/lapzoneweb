<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục mật khẩu | Lapzone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/otp-verification.css}">
    <th:block th:replace="~{fragments/theme :: head}"></th:block>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
<main class="card otp-card otp-card--inline shadow p-4">
    <h3 class="text-center text-danger mb-4 fw-bold">LAPZONE</h3>
    <h5 class="text-center mb-3">Khôi phục mật khẩu</h5>

    <div th:if="${message}" class="alert alert-success text-center" th:text="${message}"></div>
    <div th:if="${error != null and otpResult != 'error'}"
         class="alert alert-danger text-center" th:text="${error}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label fw-bold">Email đăng nhập</label>
            <input id="email" type="email" name="email" class="form-control" required
                   placeholder="Nhập email...">
        </div>
        <button type="submit" class="btn btn-danger w-100 fw-bold py-2">Gửi mã xác nhận</button>
    </form>

    <section th:if="${otpStep}" class="border-top mt-4 pt-3">
        <form th:action="@{/forgot-password/verify-otp}" method="post" data-otp-form novalidate>
            <label class="form-label fw-bold" for="otp-digit-1">Mã xác nhận 6 số</label>
            <th:block th:replace="~{fragments/otp-verification :: fields}"></th:block>
            <button type="submit" class="otp-submit-button" data-otp-submit>Xác minh OTP</button>
        </form>
        <form th:action="@{/forgot-password/resend}" method="post" class="otp-resend-form">
            <button type="submit" class="otp-resend-button" data-otp-resend
                    th:attr="data-wait=${resendWaitSeconds}">Gửi lại mã</button>
            <div class="otp-countdown" data-otp-countdown aria-live="polite"></div>
        </form>
    </section>

    <div class="text-center mt-3">
        <a th:href="@{/dangnhap}" class="text-decoration-none text-secondary">Quay lại Đăng nhập</a>
    </div>
</main>
<script defer th:src="@{/js/otp-verification.js}"></script>
</body>
</html>

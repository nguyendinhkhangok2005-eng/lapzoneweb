<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục mật khẩu | Lapzone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
<main class="card shadow p-4" style="width: 100%; max-width: 430px; border-top: 4px solid #d32f2f;">
    <h3 class="text-center text-danger mb-4 fw-bold">LAPZONE</h3>
    <h5 class="text-center mb-3">Khôi phục mật khẩu</h5>

    <div th:if="${message}" class="alert alert-success text-center" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label fw-bold">Email đăng nhập</label>
            <input id="email" type="email" name="email" class="form-control" required
                   placeholder="Nhập email...">
        </div>
        <button type="submit" class="btn btn-danger w-100 fw-bold py-2">Gửi mã xác nhận</button>
    </form>

    <section th:if="${otpStep}" class="border-top mt-4 pt-3">
        <form th:action="@{/forgot-password/verify-otp}" method="post">
            <label for="otp" class="form-label fw-bold">Mã xác nhận 6 số</label>
            <input id="otp" name="otp" class="form-control text-center mb-3"
                   inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}"
                   maxlength="6" required>
            <button type="submit" class="btn btn-success w-100 fw-bold">Xác nhận mã</button>
        </form>
        <form th:action="@{/forgot-password/resend}" method="post" class="mt-2">
            <button type="submit" class="btn btn-outline-secondary w-100">Gửi lại mã</button>
        </form>
    </section>

    <div class="text-center mt-3">
        <a th:href="@{/dangnhap}" class="text-decoration-none text-secondary">Quay lại Đăng nhập</a>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt mật khẩu mới | Lapzone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/otp-verification.css}">
    <th:block th:replace="~{fragments/theme :: head}"></th:block>
</head>
<body class="otp-reset-page bg-light d-flex align-items-center justify-content-center">
    <div class="card otp-card otp-card--inline shadow p-4">
        <h3 class="text-center text-success mb-4 fw-bold">LAPZONE</h3>
        <h5 class="text-center mb-3">Tạo mật khẩu mới</h5>

        <section th:if="${otpVerified}" class="otp-success-banner" role="status">
            <div class="otp-success-banner__icon" aria-hidden="true">✓</div>
            <p>Xác minh thành công. Tiếp tục đặt lại mật khẩu của bạn.</p>
            <a href="#reset-password-form" class="otp-success-banner__continue">Tiếp tục</a>
        </section>
        
        <div th:if="${message}" class="text-center">
            <div class="alert alert-success">[[${message}]]</div>
            <a th:href="@{/dangnhap}" class="btn btn-success w-100 fw-bold mt-2">Đi tới Đăng nhập</a>
        </div>
        
        <div th:if="${error != null}" class="alert alert-danger text-center" th:text="${error}"></div>

        <form id="reset-password-form" th:if="${message == null}" th:action="@{/reset-password}" method="post">
            <input type="hidden" name="resetToken" th:value="${resetToken}">
            
            <div class="mb-4">
                <label class="form-label fw-bold">Mật khẩu mới</label>
                <input type="password" name="newPassword" class="form-control" required minlength="8" placeholder="Nhập mật khẩu mới (ít nhất 8 ký tự)...">
                <small class="form-text text-muted">Cần có chữ hoa, chữ thường, số và ký tự đặc biệt.</small>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2">Lưu Mật Khẩu</button>
        </form>

    </div>
</body>
</html>

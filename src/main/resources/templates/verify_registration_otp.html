<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác minh OTP | Lapzone</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/otp-verification.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <th:block th:replace="~{fragments/theme :: head}"></th:block>
</head>
<body class="otp-page">
<main class="otp-card">
    <section th:if="${otpVerified}" class="otp-success-view" data-otp-success
             data-continue-url="/dangnhap" role="status">
        <p class="otp-brand">LAPZONE</p>
        <div class="otp-success-view__icon" aria-hidden="true">✓</div>
        <h1 class="otp-title">Xác minh thành công</h1>
        <p th:text="${success}">Đăng ký thành công! Hãy đăng nhập.</p>
        <a th:href="@{/dangnhap}" class="otp-success-view__continue">Tiếp tục</a>
    </section>

    <th:block th:unless="${otpVerified}">
        <p class="otp-brand">LAPZONE</p>
        <h1 class="otp-title">Xác minh OTP</h1>
        <p class="otp-description">
            Nhập mã xác thực 6 số đã được gửi đến email
            <strong class="otp-email" th:text="${email}"></strong>
        </p>

        <div th:if="${error != null and otpResult != 'error'}"
             class="alert alert-danger text-center" role="alert" th:text="${error}"></div>

        <form th:action="@{/dangki/xac-thuc}" method="post" data-otp-form novalidate>
            <label class="form-label fw-bold" for="otp-digit-1">Mã xác thực</label>
            <th:block th:replace="~{fragments/otp-verification :: fields}"></th:block>
            <button type="submit" class="otp-submit-button" data-otp-submit>Xác minh OTP</button>
        </form>

        <form th:action="@{/dangki/xac-thuc/gui-lai}" method="post" class="otp-resend-form">
            <button type="submit" class="otp-resend-button" data-otp-resend
                    th:attr="data-wait=${resendWaitSeconds}">Gửi lại mã</button>
            <div class="otp-countdown" data-otp-countdown aria-live="polite"></div>
        </form>

        <div class="text-center">
            <a th:href="@{/dangki}" class="otp-back-link">Quay lại đăng ký</a>
        </div>
    </th:block>
</main>
<script defer th:src="@{/js/otp-verification.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực email | Lapzone</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
<main class="card shadow p-4" style="width: 100%; max-width: 430px;">
    <h3 class="text-center text-danger fw-bold">LAPZONE</h3>
    <h5 class="text-center mb-3">Xác thực email đăng ký</h5>
    <p class="text-center text-secondary">
        Nhập mã 6 số đã gửi đến <strong th:text="${email}"></strong>.
    </p>
    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
    <form th:action="@{/dangki/xac-thuc}" method="post">
        <label for="otp" class="form-label fw-bold">Mã xác nhận</label>
        <input id="otp" name="otp" class="form-control text-center mb-3"
               inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}"
               maxlength="6" required autofocus>
        <button type="submit" class="btn btn-danger w-100 fw-bold">Xác nhận email</button>
    </form>
    <form th:action="@{/dangki/xac-thuc/gui-lai}" method="post" class="mt-3">
        <button id="resendButton" type="submit" class="btn btn-outline-secondary w-100"
                th:attr="data-wait=${resendWaitSeconds}">Gửi lại mã</button>
        <div id="countdown" class="small text-center text-secondary mt-2" aria-live="polite"></div>
    </form>
    <div class="text-center mt-3">
        <a th:href="@{/dangki}" class="text-secondary">Quay lại đăng ký</a>
    </div>
</main>
<script>
    const resendButton = document.getElementById('resendButton');
    const countdown = document.getElementById('countdown');
    let remaining = Number(resendButton.dataset.wait || 0);

    function updateCountdown() {
        resendButton.disabled = remaining > 0;
        countdown.textContent = remaining > 0
            ? `Có thể gửi lại mã sau ${remaining} giây.`
            : '';
        if (remaining > 0) {
            remaining--;
            window.setTimeout(updateCountdown, 1000);
        }
    }

    updateCountdown();
</script>
</body>
</html>

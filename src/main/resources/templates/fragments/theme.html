<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="head">
    <script>
        (function () {
            var theme = 'classic';
            try {
                var storedTheme = window.localStorage.getItem('lapzone-theme');
                if (storedTheme === 'ocean') {
                    theme = 'aurora';
                    try {
                        window.localStorage.setItem('lapzone-theme', theme);
                    } catch (error) {
                        // The migrated theme still applies to this page.
                    }
                } else if (['classic', 'dark', 'gaming', 'aurora'].indexOf(storedTheme) !== -1) {
                    theme = storedTheme;
                }
            } catch (error) {
                // Use the default theme when browser storage is unavailable.
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
    <link rel="stylesheet" th:href="@{/css/customer-aurora.css}">
    <script defer th:src="@{/js/customer-theme.js}"></script>
</th:block>

<div th:fragment="chatbot_widget">
    <!-- CSS Tùy chỉnh Chatbot -->
    <style>
        .chatbot-support { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--chatbot-border); font-size: 12px; }
        .chatbot-support button, .chatbot-support a { display: inline-block; margin: 4px 6px 4px 0; padding: 7px 9px; border: 1px solid var(--chatbot-border); border-radius: 7px; background: var(--chatbot-input); color: var(--chatbot-text); font: inherit; cursor: pointer; }
        .chatbot-support button:disabled { opacity: .6; cursor: default; }
        .chatbot-support [hidden] { display: none; }
        .chatbot-support blockquote, .chatbot-support-preview { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; padding: 8px; background: var(--chatbot-canvas); border-radius: 7px; max-height: 180px; overflow-y: auto; font: inherit; }
        .chatbot-support-context { max-height: 220px; overflow-y: auto; }
        .chatbot-support label { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
        .chatbot-support input[type="checkbox"] { flex: 0 0 auto; margin-top: 3px; }
        .chatbot-support p, .chatbot-support small { color: var(--chatbot-muted); }
        .chatbot-feedback { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--chatbot-border); display: flex; flex-wrap: wrap; gap: 6px; }
        .chatbot-feedback button, .chatbot-feedback select { border: 1px solid var(--chatbot-border); border-radius: 7px; padding: 6px 9px; background: var(--chatbot-input); color: var(--chatbot-text); font-size: 12px; max-width: 100%; }
        .chatbot-feedback button[aria-pressed="true"] { font-weight: 700; border-color: var(--chatbot-text); }
        .chatbot-feedback button:disabled { opacity: .65; }
        .chatbot-feedback small { flex-basis: 100%; font-size: 11px; color: var(--chatbot-muted); }
        #chatbot-messages .chatbot-promotion { display: inline-block; margin: 4px 0 8px; padding: 3px 8px; border: 1px solid var(--chatbot-border); border-radius: 999px; background: var(--chatbot-canvas); color: var(--chatbot-text); font-size: 12px; font-weight: 700; }
        .chatbot-feedback-reasons { flex-basis: 100%; }
        #chatbot-messages .chatbot-products { display: grid; gap: 12px; margin-top: 12px; }
        #chatbot-messages .chatbot-product-card { padding: 12px; min-width: 0; text-align: left; }
        #chatbot-messages .chatbot-product-card .product-img-wrapper { height: 130px; display: grid; place-items: center; }
        #chatbot-messages .chatbot-product-card .product-img { max-width: 100%; height: 120px; object-fit: contain; }
        #chatbot-messages .chatbot-product-card .product-title { height: auto; margin: 8px 0; }
        #chatbot-messages .chatbot-product-card dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12px; }
        #chatbot-messages .chatbot-product-card dd { margin: 0; overflow-wrap: anywhere; }
        /* Only the website preset inherits page colors; explicit palettes use fixed tokens. */
        #chatbot-window, #chatbot-btn, .chatbot-background-preview {
            --chatbot-surface: var(--bg-card, #ffffff);
            --chatbot-canvas: var(--bg-card-hover, #f1f5f9);
            --chatbot-hover: var(--bg-card-hover, #f1f5f9);
            --chatbot-text: var(--text-primary, #24364a);
            --chatbot-muted: var(--text-secondary, #526477);
            --chatbot-border: var(--border-glass, #cbd5e1);
            --chatbot-input: var(--theme-input, #ffffff);
            --chatbot-accent: var(--accent-button, #365f83);
            --chatbot-on-accent: #ffffff;
            --chatbot-focus: var(--accent-blue, #365f83);
            --chatbot-bot: var(--bg-card, #ffffff);
            --chatbot-link: var(--accent-blue, #365f83);
            --chatbot-danger: var(--accent-red, #b91c1c);
            --chatbot-accent-hover: color-mix(in srgb, var(--chatbot-accent) 88%, #000000);
            --chatbot-control-border: color-mix(in srgb, var(--chatbot-on-accent) 70%, transparent);
            --chatbot-input-border: color-mix(in srgb, var(--chatbot-muted) 75%, var(--chatbot-input));
            color-scheme: inherit;
        }

        :is(#chatbot-window, #chatbot-btn, .chatbot-background-preview)[data-chatbot-theme="purple"] {
            --chatbot-surface: #242132; --chatbot-canvas: #1c1927; --chatbot-hover: #302b41;
            --chatbot-text: #f0edf7; --chatbot-muted: #bab3cc; --chatbot-border: #4b455e;
            --chatbot-input: #211d2e; --chatbot-accent: #655486; --chatbot-on-accent: #ffffff;
            --chatbot-focus: #c3b2e5; --chatbot-bot: #302b41; --chatbot-link: #c3b2e5;
            --chatbot-danger: #f0a5ad; color-scheme: dark;
        }

        :is(#chatbot-window, #chatbot-btn, .chatbot-background-preview)[data-chatbot-theme="blue"] {
            --chatbot-surface: #ffffff; --chatbot-canvas: #eef2f6; --chatbot-hover: #e3ebf3;
            --chatbot-text: #24364a; --chatbot-muted: #526477; --chatbot-border: #bdcad7;
            --chatbot-input: #ffffff; --chatbot-accent: #365f83; --chatbot-on-accent: #ffffff;
            --chatbot-focus: #365f83; --chatbot-bot: #e0e8f0; --chatbot-link: #365f83;
            --chatbot-danger: #a42b3c; color-scheme: light;
        }

        :is(#chatbot-window, #chatbot-btn, .chatbot-background-preview)[data-chatbot-theme="light"] {
            --chatbot-surface: #ffffff; --chatbot-canvas: #f4f5f7; --chatbot-hover: #ebedf0;
            --chatbot-text: #252d38; --chatbot-muted: #5d6572; --chatbot-border: #cdd2d9;
            --chatbot-input: #ffffff; --chatbot-accent: #4b596b; --chatbot-on-accent: #ffffff;
            --chatbot-focus: #4b596b; --chatbot-bot: #e9ecf0; --chatbot-link: #425d7b;
            --chatbot-danger: #a42b3c; color-scheme: light;
        }

        #chatbot-btn {
            position: fixed; bottom: 30px; right: 30px; z-index: 9999;
            width: 60px; height: 60px; background-color: var(--chatbot-accent);
            color: var(--chatbot-on-accent); border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 28px; border: none;
            transition: transform 180ms ease, filter 180ms ease, box-shadow 180ms ease;
        }
        #chatbot-btn:hover { filter: brightness(.92); transform: scale(1.1); }
        
        #chatbot-window {
            position: fixed; bottom: 100px; right: 30px; z-index: 9999;
            width: 360px; height: min(480px, calc(100dvh - 116px)); background: var(--chatbot-surface);
            border-radius: 16px; box-shadow: 0 12px 36px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; overflow: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 14px; line-height: 1.45; color: var(--chatbot-text);
            box-sizing: border-box; visibility: hidden; opacity: 0;
            pointer-events: none; transform: translateY(12px) scale(.985);
            transition: opacity 200ms ease, transform 200ms ease,
                visibility 0s linear 200ms, width 260ms ease, height 260ms ease,
                right 260ms ease, bottom 260ms ease, top 260ms ease,
                border-radius 260ms ease;
        }

        #chatbot-window.is-open {
            visibility: visible; opacity: 1; pointer-events: auto;
            transform: translateY(0) scale(1); transition-delay: 0s;
        }

        #chatbot-window[data-chatbot-mode="fullscreen"] {
            right: 0; bottom: 0; width: 100vw;
            height: 100vh; height: 100dvh; border-radius: 0;
        }
        
        #chatbot-header {
            background: var(--chatbot-accent); color: var(--chatbot-on-accent); padding: 11px 14px;
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            flex-shrink: 0;
        }

        #chatbot-title {
            min-width: 0; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; flex: 1 1 auto;
            font-size: 15px; font-weight: 700; letter-spacing: .01em; line-height: 1.25;
        }

        .chatbot-window-controls {
            display: flex; align-items: center; gap: 6px; flex: 0 0 auto;
        }

        .chatbot-window-controls > button,
        .chatbot-background-settings > button {
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; min-width: 32px; height: 32px; padding: 0;
            border: 1px solid var(--chatbot-control-border); border-radius: 8px;
            background: transparent; color: var(--chatbot-on-accent); font: inherit;
            line-height: 1; cursor: pointer;
            transition: background-color 160ms ease, border-color 160ms ease,
                color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
        }

        .chatbot-window-controls > button:hover,
        .chatbot-window-controls > button:focus-visible,
        .chatbot-window-controls > button[aria-pressed="true"],
        .chatbot-window-controls > button[aria-expanded="true"],
        .chatbot-background-settings > button:hover,
        .chatbot-background-settings > button:focus-visible,
        .chatbot-background-settings > button[aria-expanded="true"] {
            background: var(--chatbot-accent-hover); border-color: var(--chatbot-on-accent);
        }

        .chatbot-window-controls > button:hover,
        .chatbot-background-settings > button:hover { transform: translateY(-1px); }
        .chatbot-window-controls > button:focus-visible,
        .chatbot-background-settings > button:focus-visible {
            outline: 2px solid var(--chatbot-on-accent); outline-offset: 2px;
        }
        .chatbot-window-controls > button:active,
        .chatbot-background-settings > button:active { transform: scale(.96); }

        #chatbot-fullscreen-toggle svg {
            display: block; width: 18px; height: 18px;
        }

        #chatbot-fullscreen-toggle svg[hidden] { display: none; }

        #chatbot-conversations-toggle {
            font-size: 17px;
        }

        #chatbot-header { position: relative; z-index: 5; }

        .chatbot-background-settings { position: static; }

        #chatbot-background-menu {
            position: absolute; top: calc(100% + 8px); right: 12px; z-index: 20;
            box-sizing: border-box; width: min(276px, calc(100vw - 24px));
            max-height: min(360px, calc(var(--chatbot-viewport-height, 100dvh) - 112px));
            overflow-y: auto; overscroll-behavior: contain;
            padding: 10px; border: 1px solid var(--chatbot-border);
            border-radius: 12px; background: var(--chatbot-surface);
            color: var(--chatbot-text); box-shadow: 0 12px 32px rgba(15,23,42,.22);
            visibility: hidden; opacity: 0; pointer-events: none;
            transform: translateY(-6px) scale(.985);
            transform-origin: top right;
            transition: opacity 160ms ease, transform 160ms ease, visibility 0s linear 160ms;
        }

        #chatbot-background-menu[hidden] { display: none; }

        #chatbot-window[data-chatbot-mode="compact"] #chatbot-background-menu {
            max-height: min(360px, calc(var(--chatbot-viewport-height, 100dvh) - 196px));
        }

        #chatbot-background-menu.is-open {
            visibility: visible; opacity: 1; pointer-events: auto;
            transform: translateY(0) scale(1); transition-delay: 0s;
        }

        .chatbot-background-menu__heading {
            margin: 0 2px 8px; font-size: 12px; font-weight: 700;
            letter-spacing: .01em; color: var(--chatbot-text);
        }

        .chatbot-background-menu__choices {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px;
        }

        .chatbot-background-choice {
            position: relative; display: flex; min-width: 0; flex-direction: column;
            align-items: stretch; gap: 5px; padding: 6px; border: 1px solid transparent; border-radius: 9px;
            background: transparent; color: inherit; font: inherit;
            text-align: left; cursor: pointer; transition: background-color .16s ease, border-color .16s ease, transform .16s ease;
        }

        .chatbot-background-choice:hover,
        .chatbot-background-choice:focus-visible,
        .chatbot-background-choice[aria-checked="true"] {
            background: var(--chatbot-hover); border-color: var(--chatbot-focus);
        }

        .chatbot-background-choice:hover { transform: translateY(-1px); }

        .chatbot-background-choice:focus-visible {
            outline: 2px solid var(--chatbot-focus); outline-offset: -2px;
        }

        .chatbot-background-preview {
            display: block; width: 100%; height: 34px; flex: none;
            border: 1px solid var(--chatbot-border); border-radius: 6px;
            background: linear-gradient(90deg, var(--chatbot-canvas) 50%, var(--chatbot-surface) 50% 75%, var(--chatbot-accent) 75%);
        }

        .chatbot-background-choice__name {
            font-size: 11px; line-height: 1.35; min-height: 2.7em;
        }

        .chatbot-background-choice__check {
            position: absolute; top: 8px; right: 9px; display: grid; place-items: center;
            width: 20px; height: 20px; border-radius: 50%; font-weight: 700;
            background: var(--chatbot-accent); color: var(--chatbot-on-accent);
        }

        .chatbot-background-choice__check:empty { display: none; }
        
        #chatbot-messages {
            flex: 1; min-height: 0; padding: 16px; overflow-y: auto; overflow-x: hidden;
            background: var(--chatbot-canvas);
        }

        #chatbot-conversation-layout {
            position: relative; display: flex; flex: 1; min-width: 0; min-height: 0;
            overflow: hidden;
        }

        #chatbot-sidebar {
            display: flex; position: absolute; inset: 0 auto 0 0; z-index: 3;
            flex: 0 0 260px; width: min(280px, 85%); min-width: 0; min-height: 0;
            box-sizing: border-box; flex-direction: column; gap: 9px; padding: 14px;
            border-right: 1px solid var(--chatbot-border);
            background: var(--chatbot-surface); color: var(--chatbot-text);
            visibility: hidden; opacity: 0; pointer-events: none;
            transform: translateX(-12px);
            transition: opacity 180ms ease, transform 180ms ease, visibility 0s linear 180ms;
        }

        #chatbot-window.chatbot-sidebar-open #chatbot-sidebar {
            visibility: visible; opacity: 1; pointer-events: auto; transform: translateX(0);
            transition-delay: 0s;
            box-shadow: 8px 0 24px rgba(0,0,0,.18);
        }

        @media (min-width: 701px) {
            #chatbot-window[data-chatbot-mode="fullscreen"] #chatbot-sidebar {
                position: relative; inset: auto; width: 0; flex: 0 0 0;
                padding-inline: 0; border-width: 0; overflow: hidden; transform: none;
                transition: flex-basis 220ms ease, width 220ms ease, padding 220ms ease,
                    opacity 180ms ease, visibility 0s linear 220ms;
            }

            #chatbot-window[data-chatbot-mode="fullscreen"].chatbot-sidebar-open #chatbot-sidebar {
                width: 260px; flex-basis: 260px; padding-inline: 14px;
                border-right-width: 1px; box-shadow: none;
            }
        }

        #chatbot-new-conversation {
            width: 100%; min-height: 40px; padding: 9px 12px;
            border: 0; border-radius: 9px;
            background: var(--chatbot-accent); color: var(--chatbot-on-accent);
            font: inherit; font-weight: 650; cursor: pointer;
            transition: background-color 160ms ease, transform 160ms ease;
        }

        #chatbot-new-conversation:hover { background: var(--chatbot-accent-hover); transform: translateY(-1px); }
        #chatbot-new-conversation:active { transform: scale(.98); }

        #chatbot-conversation-search {
            width: 100%; min-width: 0; min-height: 38px; box-sizing: border-box; padding: 8px 11px;
            border: 1px solid var(--chatbot-border); border-radius: 9px;
            background: var(--chatbot-input);
            color: var(--chatbot-text); font: inherit;
        }

        #chatbot-conversation-search:focus-visible {
            outline: 2px solid var(--chatbot-focus); outline-offset: 1px;
        }

        #chatbot-conversation-status {
            color: var(--chatbot-muted); font-size: 12px; line-height: 1.4;
        }

        #chatbot-conversation-list {
            display: flex; flex: 1; min-height: 0; flex-direction: column;
            gap: 5px; overflow-y: auto;
        }

        .chatbot-conversation-item {
            display: flex; align-items: center; gap: 3px; min-width: 0;
            padding: 4px; border-radius: 9px; border-inline-start: 3px solid transparent;
            transition: background-color 160ms ease, border-color 160ms ease;
        }

        .chatbot-conversation-item:hover { background: var(--chatbot-hover); }

        .chatbot-conversation-item[aria-current="true"] {
            background: var(--chatbot-hover); border-inline-start-color: var(--chatbot-focus);
            color: var(--chatbot-text);
        }

        .chatbot-conversation-select {
            flex: 1; min-width: 0; overflow: hidden; padding: 8px 6px;
            border: 0; border-radius: 6px; background: transparent;
            color: inherit; font: inherit; font-size: 13px; text-align: left;
            text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
        }

        .chatbot-conversation-select:hover,
        .chatbot-conversation-select:focus-visible {
            background: var(--chatbot-hover);
        }

        #chatbot-btn:focus-visible,
        #chatbot-input:focus-visible,
        #chatbot-send:focus-visible,
        #chatbot-new-conversation:focus-visible {
            outline: 2px solid var(--chatbot-focus); outline-offset: 2px;
        }

        .chatbot-conversation-select:focus-visible,
        .chatbot-conversation-action:focus-visible,
        #chatbot-load-more:focus-visible {
            outline: 2px solid var(--chatbot-focus); outline-offset: -2px;
        }

        .chatbot-conversation-action {
            flex: 0 0 auto; padding: 6px; border: 0; border-radius: 6px;
            background: transparent; color: var(--chatbot-muted);
            font: inherit; font-size: 11px; cursor: pointer;
            transition: background-color 160ms ease, color 160ms ease;
        }

        .chatbot-conversation-action:hover {
            background: var(--chatbot-hover); color: var(--chatbot-text);
        }

        .chatbot-conversation-action--delete:hover { color: var(--chatbot-danger); }

        #chatbot-load-more {
            padding: 7px; border: 1px solid var(--chatbot-border);
            border-radius: 7px; background: transparent; color: inherit;
            font: inherit; font-size: 12px; cursor: pointer;
        }

        #chatbot-load-more:hover { background: var(--chatbot-hover); }

        #chatbot-content {
            display: flex; flex: 1; min-width: 0; min-height: 0; flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 701px) {
            #chatbot-window[data-chatbot-mode="fullscreen"] #chatbot-content {
                max-width: 880px; margin-inline: auto;
            }
        }

        #chatbot-chat-status {
            padding: 7px 12px; background: var(--chatbot-surface);
            color: var(--chatbot-muted); font-size: 12px; overflow-wrap: anywhere;
        }

        #chatbot-input-area {
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
            min-width: 0; padding: 10px 12px;
            background: var(--chatbot-surface); border-top: 1px solid var(--chatbot-border);
        }
        
        #chatbot-input {
            flex: 1; min-width: 0; min-height: 40px; box-sizing: border-box;
            padding: 9px 14px; border: 1px solid var(--chatbot-border);
            border-radius: 12px; outline: none; font: inherit;
        }
        
        #chatbot-send {
            background: var(--chatbot-accent); color: var(--chatbot-on-accent); border: none; font-weight: bold;
            flex: 0 0 auto; align-self: stretch; min-height: 40px; padding: 0 16px;
            border-radius: 12px; font: inherit; font-weight: 650; cursor: pointer;
            transition: background-color 160ms ease, transform 160ms ease;
        }
        #chatbot-window[data-chatbot-theme] #chatbot-send:hover:not(:disabled) {
            background-color: var(--chatbot-accent-hover) !important; transform: translateY(-1px);
        }
        #chatbot-send:active:not(:disabled) { transform: scale(.96); }

        #chatbot-messages .chatbot-list { margin: 6px 0; padding-left: 20px; }
        #chatbot-window[data-chatbot-theme] #chatbot-messages a {
            color: var(--chatbot-link); text-decoration: underline; text-underline-offset: 3px;
        }
        #chatbot-window[data-chatbot-theme] #chatbot-messages a:hover { color: var(--chatbot-text); }
        #chatbot-window[data-chatbot-theme] #chatbot-messages a:focus-visible {
            outline: 2px solid currentColor; outline-offset: 2px;
        }
        #chatbot-send:disabled { cursor: wait; }

        /* Keep page-wide theme rules on widget tokens. */
        #chatbot-window[data-chatbot-theme] {
            background-color: var(--chatbot-surface) !important;
            color: var(--chatbot-text) !important; border-color: var(--chatbot-border) !important;
        }

        #chatbot-window[data-chatbot-theme] :is(#chatbot-header, #chatbot-send),
        #chatbot-btn[data-chatbot-theme] {
            background-color: var(--chatbot-accent) !important; color: var(--chatbot-on-accent) !important;
        }

        #chatbot-window[data-chatbot-theme] #chatbot-messages {
            background: var(--chatbot-canvas); color: var(--chatbot-text); border-color: var(--chatbot-border);
        }

        #chatbot-window[data-chatbot-theme] #chatbot-input-area {
            background: var(--chatbot-surface); color: var(--chatbot-text); border-color: var(--chatbot-border);
        }

        #chatbot-window[data-chatbot-theme] :is(#chatbot-input, #chatbot-conversation-search) {
            background: var(--chatbot-input) !important; color: var(--chatbot-text) !important;
            border-color: var(--chatbot-input-border) !important;
            box-shadow: none;
        }

        #chatbot-window[data-chatbot-theme] :is(#chatbot-input, #chatbot-conversation-search):focus {
            border-color: var(--chatbot-focus) !important;
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--chatbot-focus) 20%, transparent);
        }

        #chatbot-window[data-chatbot-theme] input::placeholder { color: var(--chatbot-muted) !important; opacity: 1; }

        #chatbot-window[data-chatbot-theme] #chatbot-messages > div {
            background: var(--chatbot-bot) !important; color: var(--chatbot-text) !important;
        }

        #chatbot-window[data-chatbot-theme] #chatbot-messages > .chatbot-message--user {
            background: var(--chatbot-accent) !important; color: var(--chatbot-on-accent) !important;
        }

        /* Page theme rules also target nested recommendation text and card surfaces. */
        #chatbot-window[data-chatbot-theme] #chatbot-messages :is(p, li, h1, h2, h3, h4, h5, h6, strong, .product-title, .product-price, .product_price, .price-text) {
            color: inherit;
        }

        #chatbot-window[data-chatbot-theme] #chatbot-messages :is(.card, .product-card, .card-header, .card-body, .list-group-item) {
            background: var(--chatbot-surface); color: var(--chatbot-text); border-color: var(--chatbot-border);
        }

        #chatbot-window[data-chatbot-theme] #chatbot-messages :is(.text-muted, .text-secondary, .product-meta) {
            color: var(--chatbot-muted) !important;
        }

        #chatbot-window[data-chatbot-theme] #chatbot-messages > .chatbot-message--user a {
            color: var(--chatbot-on-accent);
        }

        #chatbot-messages > .chatbot-message--enter {
            box-sizing: border-box; width: fit-content; max-width: min(85%, 680px);
            padding: 10px 14px; margin-bottom: 10px;
            border-radius: 16px 16px 16px 5px;
            font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere;
            animation: chatbot-message-enter 220ms ease-out both;
        }

        #chatbot-messages > .chatbot-message--user {
            margin-inline-start: auto; border-radius: 16px 16px 5px 16px;
        }

        #chatbot-messages > .chatbot-message--thinking {
            font-size: 0 !important;
        }

        #chatbot-messages > .chatbot-message--thinking::before {
            content: "Đang trả lời";
            font-size: 14px;
        }

        #chatbot-messages > .chatbot-message--thinking::after {
            content: ""; display: inline-block; width: 4px; height: 4px;
            margin: 0 0 2px 7px; border-radius: 50%;
            background: currentColor; box-shadow: 7px 0 currentColor, 14px 0 currentColor;
            animation: chatbot-thinking 900ms ease-in-out infinite;
        }

        @keyframes chatbot-message-enter {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes chatbot-thinking {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-3px); }
        }

        @media (prefers-reduced-motion: reduce) {
            #chatbot-btn,
            #chatbot-window,
            #chatbot-sidebar,
            #chatbot-background-menu,
            .chatbot-conversation-item,
            .chatbot-conversation-action,
            .chatbot-background-choice,
            .chatbot-window-controls > button,
            .chatbot-background-settings > button,
            #chatbot-send,
            #chatbot-close,
            #chatbot-new-conversation,
            #chatbot-messages > .chatbot-message--enter,
            #chatbot-messages > .chatbot-message--thinking::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                transition-delay: 0ms !important;
            }
        }

        @media (max-width: 700px) {
            #chatbot-btn { right: 16px; bottom: 16px; width: 54px; height: 54px; }
            #chatbot-window {
                right: 12px; bottom: calc(82px + var(--chatbot-viewport-bottom, 0px));
                width: calc(100vw - 24px); max-width: none;
                height: min(68dvh, 560px, calc(var(--chatbot-viewport-height, 100dvh) - 108px));
            }
            #chatbot-window.chatbot-keyboard-open:not([data-chatbot-mode="fullscreen"]) {
                bottom: calc(12px + var(--chatbot-viewport-bottom, 0px));
                height: min(68dvh, 560px, calc(var(--chatbot-viewport-height, 100dvh) - 24px));
            }
            #chatbot-window[data-chatbot-mode="fullscreen"] {
                top: auto; right: 0; bottom: var(--chatbot-viewport-bottom, 0px);
                width: 100vw; height: var(--chatbot-viewport-height, 100dvh); border-radius: 0;
            }
            #chatbot-background-menu {
                right: 10px; width: min(276px, calc(100vw - 44px));
            }
            #chatbot-header { padding: 8px 10px; gap: 8px; }
            #chatbot-title { font-size: 14px; }
            .chatbot-window-controls { gap: 4px; }
            .chatbot-window-controls > button,
            .chatbot-background-settings > button { width: 30px; min-width: 30px; height: 30px; }
            #chatbot-messages { padding: 12px; }
            #chatbot-input-area {
                padding: 8px 10px max(8px, env(safe-area-inset-bottom));
            }
        }

        @media (max-width: 360px) {
            #chatbot-title {
                display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
                white-space: normal; line-height: 1.2;
            }
            #chatbot-input-area { gap: 6px; }
            #chatbot-send { padding-inline: 12px; }
        }
    </style>

    <!-- Script điều khiển Bật/Tắt -->
    <!-- Script điều khiển Bật/Tắt & Gửi tin nhắn -->
<script th:src="@{/js/chatbot-feedback.js}"></script>
<script th:src="@{/js/chatbot-support.js}"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const btn = document.getElementById("chatbot-btn");
        const win = document.getElementById("chatbot-window");
        const close = document.getElementById("chatbot-close");
        const sendBtn = document.getElementById("chatbot-send");
        const input = document.getElementById("chatbot-input");
        const messages = document.getElementById("chatbot-messages");
        const fullscreenToggle = document.getElementById("chatbot-fullscreen-toggle");
        const maximizeIcon = fullscreenToggle.querySelector('[data-chatbot-icon="maximize"]');
        const restoreIcon = fullscreenToggle.querySelector('[data-chatbot-icon="restore"]');
        const conversationsToggle = document.getElementById("chatbot-conversations-toggle");
        const sidebar = document.getElementById("chatbot-sidebar");
        const conversationSearch = document.getElementById("chatbot-conversation-search");
        const conversationList = document.getElementById("chatbot-conversation-list");
        const conversationStatus = document.getElementById("chatbot-conversation-status");
        const chatStatus = document.getElementById("chatbot-chat-status");
        const newConversationButton = document.getElementById("chatbot-new-conversation");
        const loadMoreButton = document.getElementById("chatbot-load-more");
        const backgroundToggle = document.getElementById("chatbot-background-toggle");
        const backgroundMenu = document.getElementById("chatbot-background-menu");
        const backgroundChoices = backgroundMenu.querySelectorAll("[data-chatbot-background]");
        const chatBackgrounds = ["theme", "purple", "blue", "light"];
        const chatBackgroundStorageKey = "lapzone-chat-background";
        let settingsHideTimer;
        const conversationPageSize = 100;
        let conversations = [];
        let conversationPage = 0;
        let hasMoreConversations = false;
        let activeConversationId = null;
        let selectionVersion = 0;
        let createConversationPromise = null;
        let initializationPromise;

        // Bật/tắt khung chat
        btn.addEventListener("click", () => {
            const isOpen = win.classList.toggle("is-open");
            win.setAttribute("aria-hidden", String(!isOpen));
        });
        close.addEventListener("click", () => {
            win.classList.remove("is-open");
            win.setAttribute("aria-hidden", "true");
        });

        function updateChatbotViewport() {
            if (!window.visualViewport) return;
            const viewport = window.visualViewport;
            const bottom = Math.max(0, window.innerHeight - viewport.offsetTop - viewport.height);
            win.style.setProperty("--chatbot-viewport-height", `${viewport.height}px`);
            win.style.setProperty("--chatbot-viewport-bottom", `${bottom}px`);
            win.classList.toggle("chatbot-keyboard-open", bottom > 100);
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", updateChatbotViewport);
            window.visualViewport.addEventListener("scroll", updateChatbotViewport);
            updateChatbotViewport();
        }
        conversationsToggle.addEventListener("click", () => setSidebarOpen(!win.classList.contains("chatbot-sidebar-open")));
        newConversationButton.addEventListener("click", createConversation);
        conversationSearch.addEventListener("input", renderConversationList);
        loadMoreButton.addEventListener("click", loadMoreConversations);

        function setChatBackground(preset, persist) {
            if (!chatBackgrounds.includes(preset)) return;
            win.dataset.chatbotTheme = preset;
            btn.dataset.chatbotTheme = preset;
            backgroundChoices.forEach(choice => {
                const selected = choice.dataset.chatbotBackground === preset;
                choice.setAttribute("aria-checked", String(selected));
                const check = choice.querySelector(".chatbot-background-choice__check");
                if (check) check.textContent = selected ? "✓" : "";
            });
            if (persist) {
                try {
                    window.localStorage.setItem(chatBackgroundStorageKey, preset);
                } catch (error) {
                    // The selected background remains active for the current page.
                }
            }
        }

        let savedChatBackground = "theme";
        try {
            savedChatBackground = window.localStorage.getItem(chatBackgroundStorageKey) || "theme";
        } catch (error) {
            // Use the website theme when browser storage is unavailable.
        }
        // Preserve existing saved choices when replacing the retired dark/pattern presets.
        const migratedChatBackground = savedChatBackground === "dark" ? "purple"
            : savedChatBackground === "pattern" ? "blue" : savedChatBackground;
        const initialChatBackground = chatBackgrounds.includes(migratedChatBackground) ? migratedChatBackground : "theme";
        setChatBackground(initialChatBackground, initialChatBackground !== savedChatBackground);

        function setSettingsOpen(isOpen) {
            window.clearTimeout(settingsHideTimer);
            backgroundToggle.setAttribute("aria-expanded", String(isOpen));
            backgroundMenu.setAttribute("aria-hidden", String(!isOpen));
            backgroundMenu.inert = !isOpen;
            if (isOpen) {
                backgroundMenu.hidden = false;
                // Let the browser register the closed state before starting the transition.
                void backgroundMenu.offsetWidth;
                backgroundMenu.classList.add("is-open");
            } else {
                backgroundMenu.classList.remove("is-open");
                settingsHideTimer = window.setTimeout(() => { backgroundMenu.hidden = true; }, 160);
            }
        }

        backgroundToggle.addEventListener("click", () => {
            setSettingsOpen(!backgroundMenu.classList.contains("is-open"));
        });

        backgroundMenu.addEventListener("click", event => {
            const choice = event.target.closest("[data-chatbot-background]");
            if (!choice) return;
            setChatBackground(choice.dataset.chatbotBackground, true);
            setSettingsOpen(false);
            backgroundToggle.focus();
        });

        win.addEventListener("keydown", event => {
            if (event.key !== "Escape") return;
            if (backgroundMenu.classList.contains("is-open")) {
                setSettingsOpen(false);
                backgroundToggle.focus();
            } else if (win.classList.contains("chatbot-sidebar-open")) {
                setSidebarOpen(false);
                conversationsToggle.focus();
            }
        });

        document.addEventListener("click", event => {
            if (backgroundMenu.classList.contains("is-open") && !backgroundMenu.parentElement.contains(event.target)) {
                setSettingsOpen(false);
            }
        });

        function setSidebarOpen(isOpen) {
            win.classList.toggle("chatbot-sidebar-open", isOpen);
            conversationsToggle.setAttribute("aria-expanded", String(isOpen));
            conversationsToggle.setAttribute("aria-label", isOpen
                ? "Đóng lịch sử cuộc trò chuyện" : "Mở lịch sử cuộc trò chuyện");
            sidebar.setAttribute("aria-hidden", String(!isOpen));
            sidebar.inert = !isOpen;
        }

        function setConversationStatus(message) {
            conversationStatus.textContent = message;
        }

        function setChatStatus(message) {
            chatStatus.textContent = message;
            chatStatus.hidden = !message;
        }

        async function apiRequest(url, options) {
            const response = await fetch(url, Object.assign({ credentials: "same-origin" }, options));
            if (!response.ok) {
                let message = `Máy chủ trả về lỗi (${response.status}).`;
                try {
                    const errorBody = await response.json();
                    message = errorBody.detail || errorBody.message || errorBody.reply || message;
                } catch (error) {
                    // Keep the HTTP status message when the server does not return JSON.
                }
                throw new Error(message);
            }
            if (response.status === 204) return null;
            return response.json();
        }

        async function fetchConversationPage(page) {
            const query = new URLSearchParams({ page: String(page), size: String(conversationPageSize) });
            return apiRequest(`/api/ai/conversations?${query.toString()}`);
        }

        function renderConversationList() {
            const searchTerm = conversationSearch.value.trim().toLocaleLowerCase();
            const filtered = conversations.filter(conversation =>
                String(conversation.title || "").toLocaleLowerCase().includes(searchTerm));
            conversationList.replaceChildren();

            if (!filtered.length) {
                const emptyState = document.createElement("div");
                emptyState.textContent = searchTerm ? "Không tìm thấy cuộc trò chuyện." : "Chưa có cuộc trò chuyện nào.";
                emptyState.style.cssText = "padding:8px;color:var(--chatbot-muted);font-size:12px";
                conversationList.appendChild(emptyState);
            }

            filtered.forEach(conversation => {
                const item = document.createElement("div");
                item.className = "chatbot-conversation-item";
                item.setAttribute("aria-current", String(conversation.id === activeConversationId));

                const select = document.createElement("button");
                select.type = "button";
                select.className = "chatbot-conversation-select";
                select.textContent = conversation.title || "Cuộc trò chuyện";
                select.title = conversation.title || "Cuộc trò chuyện";
                select.addEventListener("click", () => selectConversation(conversation.id));

                const rename = document.createElement("button");
                rename.type = "button";
                rename.className = "chatbot-conversation-action";
                rename.textContent = "Đổi tên";
                rename.setAttribute("aria-label", `Đổi tên: ${conversation.title}`);
                rename.addEventListener("click", () => renameConversation(conversation));

                const remove = document.createElement("button");
                remove.type = "button";
                remove.className = "chatbot-conversation-action chatbot-conversation-action--delete";
                remove.textContent = "Xóa";
                remove.setAttribute("aria-label", `Xóa: ${conversation.title}`);
                remove.addEventListener("click", () => deleteConversation(conversation));

                item.append(select, rename, remove);
                conversationList.appendChild(item);
            });
            loadMoreButton.hidden = !hasMoreConversations;
        }

        async function refreshConversationList() {
            const pagesToLoad = conversationPage + 1;
            const refreshed = [];
            let lastPageSize = 0;
            for (let page = 0; page < pagesToLoad; page++) {
                const batch = await fetchConversationPage(page);
                refreshed.push(...batch);
                lastPageSize = batch.length;
                if (batch.length < conversationPageSize) {
                    conversationPage = page;
                    break;
                }
            }
            conversations = refreshed;
            hasMoreConversations = lastPageSize === conversationPageSize;
            renderConversationList();
        }

        async function initializeConversationHistory() {
            const requestVersion = selectionVersion;
            setConversationStatus("Đang tải cuộc trò chuyện...");
            try {
                const firstPage = await fetchConversationPage(0);
                if (requestVersion !== selectionVersion) return;
                conversations = firstPage;
                conversationPage = 0;
                hasMoreConversations = firstPage.length === conversationPageSize;
                setConversationStatus("");
                renderConversationList();
                if (conversations.length) {
                    await selectConversation(conversations[0].id);
                } else {
                    showWelcomeMessage();
                }
            } catch (error) {
                if (requestVersion !== selectionVersion) return;
                setConversationStatus(`Không thể tải lịch sử: ${error.message}`);
                showWelcomeMessage();
            }
        }

        async function loadMoreConversations() {
            if (!hasMoreConversations) return;
            loadMoreButton.disabled = true;
            setConversationStatus("Đang tải thêm...");
            try {
                const nextPage = conversationPage + 1;
                const batch = await fetchConversationPage(nextPage);
                conversations.push(...batch);
                conversationPage = nextPage;
                hasMoreConversations = batch.length === conversationPageSize;
                setConversationStatus("");
                renderConversationList();
            } catch (error) {
                setConversationStatus(`Không thể tải thêm: ${error.message}`);
            } finally {
                loadMoreButton.disabled = false;
            }
        }

        function showWelcomeMessage() {
            messages.replaceChildren();
            appendMessage("Xin chào! Tôi là trợ lý AI của Lapzone. Bạn cần tìm mua laptop gaming hay văn phòng?", "bot");
        }

        async function selectConversation(conversationId) {
            const requestVersion = ++selectionVersion;
            activeConversationId = conversationId;
            renderConversationList();
            setChatStatus("");
            messages.replaceChildren();
            try {
                const detail = await apiRequest(`/api/ai/conversations/${encodeURIComponent(conversationId)}`);
                const votes = await apiRequest(`/api/ai/conversations/${encodeURIComponent(conversationId)}/feedback`).catch(() => null);
                if (requestVersion !== selectionVersion) return;
                activeConversationId = detail.conversation.id;
                (detail.messages || []).forEach(message => {
                    const bubble = appendMessage(message.text, message.role === "user" ? "user" : "bot");
                    if (message.role !== "user") {
                        renderBotMessage(bubble, message.text, message.products);
                        window.LapzoneAiFeedback?.attach(bubble, message.id, conversationId,
                            votes?.find(vote => vote.messageId === message.id), votes === null);
                        window.LapzoneAiSupport?.attach(bubble, message.id, conversationId, message.supportOffered);
                    }
                });
                if (!detail.messages || !detail.messages.length) showWelcomeMessage();
                renderConversationList();
                setConversationStatus("");
                if (win.dataset.chatbotMode !== "fullscreen"
                    || window.matchMedia("(max-width: 700px)").matches) {
                    setSidebarOpen(false);
                    input.focus();
                }
            } catch (error) {
                if (requestVersion !== selectionVersion) return;
                setChatStatus(`Không thể mở cuộc trò chuyện: ${error.message}`);
                setConversationStatus(`Không thể mở cuộc trò chuyện: ${error.message}`);
            }
        }

        async function createConversation() {
            if (createConversationPromise) return createConversationPromise;
            createConversationPromise = (async () => {
                newConversationButton.disabled = true;
                setConversationStatus("Đang tạo cuộc trò chuyện...");
                try {
                    const created = await apiRequest("/api/ai/conversations", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({})
                    });
                    selectionVersion++;
                    activeConversationId = created.id;
                    conversations = [created, ...conversations.filter(item => item.id !== created.id)];
                    const loadedConversationLimit = conversationPageSize * (conversationPage + 1);
                    if (conversations.length > loadedConversationLimit) conversations.pop();
                    setConversationStatus("");
                    setChatStatus("");
                    renderConversationList();
                    showWelcomeMessage();
                    setSidebarOpen(false);
                    input.focus();
                    return created;
                } catch (error) {
                    setConversationStatus(`Không thể tạo cuộc trò chuyện: ${error.message}`);
                    setChatStatus(`Không thể tạo cuộc trò chuyện: ${error.message}`);
                    return null;
                } finally {
                    newConversationButton.disabled = false;
                    createConversationPromise = null;
                }
            })();
            return createConversationPromise;
        }

        async function renameConversation(conversation) {
            const title = window.prompt("Nhập tên mới cho cuộc trò chuyện:", conversation.title);
            if (title === null) return;
            if (!title.trim()) {
                setConversationStatus("Tên cuộc trò chuyện không được để trống.");
                return;
            }
            setConversationStatus("Đang đổi tên...");
            try {
                const updated = await apiRequest(`/api/ai/conversations/${encodeURIComponent(conversation.id)}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title: title.trim() })
                });
                conversations = conversations.map(item => item.id === updated.id ? updated : item);
                setConversationStatus("");
                renderConversationList();
            } catch (error) {
                setConversationStatus(`Không thể đổi tên: ${error.message}`);
            }
        }

        async function deleteConversation(conversation) {
            const confirmed = window.confirm(
                `Bạn có chắc muốn xóa “${conversation.title}”? Tin nhắn trong cuộc trò chuyện này cũng sẽ bị xóa.`
            );
            if (!confirmed) return;
            setConversationStatus("Đang xóa cuộc trò chuyện...");
            try {
                await apiRequest(`/api/ai/conversations/${encodeURIComponent(conversation.id)}`, { method: "DELETE" });
                conversations = conversations.filter(item => item.id !== conversation.id);
                const wasActive = activeConversationId === conversation.id;
                if (wasActive) {
                    activeConversationId = null;
                    selectionVersion++;
                    if (conversations.length) {
                        await selectConversation(conversations[0].id);
                    } else {
                        setChatStatus("");
                        showWelcomeMessage();
                    }
                }
                setConversationStatus("");
                renderConversationList();
                try {
                    await refreshConversationList();
                } catch (error) {
                    setConversationStatus(`Đã xóa, nhưng không thể làm mới danh sách: ${error.message}`);
                }
            } catch (error) {
                setConversationStatus(`Không thể xóa cuộc trò chuyện: ${error.message}`);
            }
        }

        function refreshAfterChat() {
            refreshConversationList().catch(error => {
                setConversationStatus(`Không thể cập nhật lịch sử: ${error.message}`);
            });
        }

        fullscreenToggle.addEventListener("click", () => {
            const fullscreen = win.dataset.chatbotMode !== "fullscreen";
            win.dataset.chatbotMode = fullscreen ? "fullscreen" : "compact";
            fullscreenToggle.setAttribute("aria-pressed", String(fullscreen));
            const label = fullscreen ? "Thu nhỏ cửa sổ chat" : "Mở toàn màn hình";
            fullscreenToggle.setAttribute("aria-label", label);
            fullscreenToggle.title = label;
            maximizeIcon.hidden = fullscreen;
            restoreIcon.hidden = !fullscreen;
        });

        // Hàm xử lý gửi tin nhắn
        async function sendMessage() {
            const text = input.value.trim();
            if (!text || sendBtn.disabled) return;
            sendBtn.disabled = true;
            let loadingDiv = null;
            let requestConversationId = null;
            let timeoutId = null;

            try {
                await initializationPromise;
                if (!activeConversationId) {
                    const created = await createConversation();
                    if (!created) throw new Error("Không thể tạo cuộc trò chuyện.");
                }
                requestConversationId = activeConversationId;
                setChatStatus("");
                appendMessage(text, "user");
                input.value = "";
                loadingDiv = appendMessage("Đang trả lời...", "bot");
                loadingDiv.classList.add("chatbot-message--thinking");

                const controller = new AbortController();
                timeoutId = window.setTimeout(() => controller.abort(), 30000);
                const data = await apiRequest("/api/ai/chat", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, conversationId: requestConversationId }),
                    signal: controller.signal
                });

                if (activeConversationId === requestConversationId && loadingDiv.isConnected) {
                    renderBotMessage(loadingDiv, data.reply || "Không có phản hồi từ AI", data.products);
                    window.LapzoneAiFeedback?.attach(loadingDiv, data.messageId, requestConversationId);
                    window.LapzoneAiSupport?.attach(loadingDiv, data.messageId, requestConversationId, data.supportOffered);
                }
                refreshAfterChat();
            } catch (error) {
                if (loadingDiv && activeConversationId === requestConversationId && loadingDiv.isConnected) {
                    loadingDiv.innerText = error.name === "AbortError"
                        ? "Yêu cầu đã quá thời gian chờ. Vui lòng thử lại."
                        : error.message;
                } else {
                    setChatStatus(error.message || "Không thể gửi tin nhắn, vui lòng thử lại.");
                }
            } finally {
                if (timeoutId !== null) window.clearTimeout(timeoutId);
                if (loadingDiv) loadingDiv.classList.remove("chatbot-message--thinking");
                sendBtn.disabled = false;
            }
        }

        // Bắt sự kiện click nút Gửi & ấn phím Enter
        sendBtn.addEventListener("click", sendMessage);
        input.addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMessage();
        });
        initializationPromise = initializeConversationHistory();

        // Hàm hỗ trợ vẽ tin nhắn lên giao diện
        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add("chatbot-message--enter");
            msgDiv.classList.add(sender === 'user' ? 'chatbot-message--user' : 'chatbot-message--ai');

            msgDiv.innerText = text;
            messages.appendChild(msgDiv);
            messages.scrollTop = messages.scrollHeight;
            return msgDiv;
        }

        function renderBotMessage(bubble, text, products) {
            bubble.innerHTML = formatBotReply(text || "");
            if (!Array.isArray(products) || !products.length) return;
            const cards = document.createElement("div");
            cards.className = "chatbot-products";
            for (const product of products) {
                if (!Number.isSafeInteger(product.id) || product.id <= 0
                    || product.detailUrl !== `/product_detail?id=${product.id}`) continue;
                // Reuse the storefront card structure/classes; every fact is from the API.
                const card = document.createElement("article");
                card.className = "product-card chatbot-product-card";
                const link = document.createElement("a");
                link.className = "home-product-link";
                link.href = product.detailUrl;
                const imageBox = document.createElement("div");
                imageBox.className = "product-img-wrapper";
                if (typeof product.imageUrl === "string" && /^\/(assets|uploads)\//.test(product.imageUrl)) {
                    const image = document.createElement("img");
                    image.className = "product-img";
                    image.src = product.imageUrl;
                    image.alt = product.name || "";
                    image.loading = "lazy";
                    image.addEventListener("error", () => { imageBox.textContent = "Chưa có ảnh"; });
                    imageBox.appendChild(image);
                } else imageBox.textContent = "Chưa có ảnh";
                const title = document.createElement("h3");
                title.className = "product-title";
                title.textContent = product.name || "";
                const price = document.createElement("div");
                price.className = "product-price";
                price.textContent = Number.isFinite(product.price) && product.price > 0
                    ? new Intl.NumberFormat("vi-VN", { style: "currency", currency: "VND" }).format(product.price)
                    : "Giá chưa cập nhật";
                const stock = document.createElement("div");
                stock.className = "product-meta";
                stock.textContent = product.available && product.stock > 0 ? `Còn hàng: ${product.stock}`
                    : product.stock === null ? "Tồn kho chưa cập nhật" : "Hiện không còn hàng";
                link.append(imageBox, title, price);
                card.append(link, stock);
                if (Number.isInteger(product.promotionPercent) && product.promotionPercent > 0 && product.promotionPercent <= 100) {
                    const promotion = document.createElement("span");
                    promotion.className = "chatbot-promotion";
                    promotion.textContent = `Ưu đãi ${product.promotionPercent}%`;
                    card.appendChild(promotion);
                }
                const specs = document.createElement("dl");
                specs.className = "product-meta";
                for (const [label, value] of Object.entries(product.specifications || {})) {
                    const term = document.createElement("dt");
                    term.textContent = label;
                    const description = document.createElement("dd");
                    description.textContent = value;
                    specs.append(term, description);
                }
                card.appendChild(specs);
                cards.appendChild(card);
            }
            bubble.appendChild(cards);
            messages.scrollTop = messages.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }

        function formatBotReply(text) {
            const lines = escapeHtml(String(text)).split(/\r?\n/);
            const output = [];
            let inList = false;
            for (const line of lines) {
                const item = line.match(/^\s*[-*]\s+(.+)$/);
                if (item) {
                    if (!inList) {
                        output.push('<ul class="chatbot-list">');
                        inList = true;
                    }
                    output.push('<li>' + formatInline(item[1]) + '</li>');
                } else {
                    if (inList) {
                        output.push('</ul>');
                        inList = false;
                    }
                    if (line) output.push(formatInline(line));
                    output.push('<br>');
                }
            }
            if (inList) output.push('</ul>');
            return output.join('');
        }

        function formatInline(text) {
            return text
                .replace(/\/product_detail\?id=(\d+)/g,
                    '<a class="chatbot-link" href="/product_detail?id=$1" target="_blank" rel="noopener">Xem chi tiết</a>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        }
    });
</script>
</div>

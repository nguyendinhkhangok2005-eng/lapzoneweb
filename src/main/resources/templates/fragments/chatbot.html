<div th:fragment="chatbot_widget">
    <!-- CSS Tùy chỉnh Chatbot -->
    <style>
        #chatbot-btn {
            position: fixed; bottom: 30px; right: 30px; z-index: 9999;
            width: 60px; height: 60px; background-color: #0b5ed7;
            color: white; border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 28px; border: none; transition: 0.3s;
        }
        #chatbot-btn:hover { background-color: #0a58ca; transform: scale(1.1); }
        
        #chatbot-window {
            position: fixed; bottom: 100px; right: 30px; z-index: 9999;
            width: 350px; height: 450px; background: white;
            border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: none; flex-direction: column; overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #chatbot-header {
            background: #0b5ed7; color: white; padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        #chatbot-messages {
            flex: 1; padding: 15px; overflow-y: auto; background: #f8f9fa;
        }
        
        #chatbot-input-area {
            display: flex; padding: 10px; background: white; border-top: 1px solid #eee;
        }
        
        #chatbot-input {
            flex: 1; padding: 10px; border: 1px solid #ccc;
            border-radius: 20px; outline: none; padding-left: 15px;
        }
        
        #chatbot-send {
            background: #0b5ed7; color: white; border: none; font-weight: bold;
            padding: 0 15px; margin-left: 10px; border-radius: 20px; cursor: pointer;
        }
        #chatbot-reset {
            background: transparent; color: white; border: 1px solid rgba(255,255,255,.7);
            border-radius: 14px; padding: 4px 8px; cursor: pointer; font-size: 12px;
        }
        #chatbot-messages .chatbot-list { margin: 4px 0; padding-left: 20px; }
        #chatbot-messages .chatbot-link { color: #0b5ed7; }
        #chatbot-send:disabled { opacity: .65; cursor: wait; }
    </style>

    <!-- Giao diện HTML -->
    <button id="chatbot-btn">💬</button>
    
    <div id="chatbot-window">
        <div id="chatbot-header">
            <b>Lapzone AI Tư Vấn</b>
            <button id="chatbot-reset" type="button" aria-label="Bắt đầu cuộc trò chuyện mới">Làm mới</button>
            <button id="chatbot-close" style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        
        <div id="chatbot-messages">
            <div style="background:#e9ecef; padding:10px 15px; border-radius:15px; display:inline-block; max-width:85%; margin-bottom:10px; font-size:14px; line-height: 1.5;">
                Xin chào! Tôi là trợ lý AI của Lapzone. Bạn cần tìm mua laptop gaming hay văn phòng?
            </div>
        </div>
        
        <div id="chatbot-input-area">
            <input type="text" id="chatbot-input" maxlength="500" placeholder="Nhập câu hỏi của bạn...">
            <button id="chatbot-send">Gửi</button>
        </div>
    </div>

    <!-- Script điều khiển Bật/Tắt -->
    <!-- Script điều khiển Bật/Tắt & Gửi tin nhắn -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const btn = document.getElementById("chatbot-btn");
        const win = document.getElementById("chatbot-window");
        const close = document.getElementById("chatbot-close");
        const resetBtn = document.getElementById("chatbot-reset");
        const sendBtn = document.getElementById("chatbot-send");
        const input = document.getElementById("chatbot-input");
        const messages = document.getElementById("chatbot-messages");

        // Bật/tắt khung chat
        btn.addEventListener("click", () => win.style.display = win.style.display === "flex" ? "none" : "flex");
        close.addEventListener("click", () => win.style.display = "none");
        resetBtn.addEventListener("click", resetConversation);

        // Hàm xử lý gửi tin nhắn
        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            // 1. Hiển thị tin nhắn của người dùng
            appendMessage(text, 'user');
            input.value = '';

            // 2. Hiển thị trạng thái đang xử lý
            const loadingDiv = appendMessage('Đang trả lời...', 'bot');
            sendBtn.disabled = true;
            const controller = new AbortController();
            const timeoutId = window.setTimeout(() => controller.abort(), 30000);

            try {
                // 3. Gọi chính xác API backend
                const response = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                    signal: controller.signal
                });

                const data = await response.json();
                if (!response.ok) {
                    loadingDiv.innerText = data.reply || 'Có lỗi xảy ra, vui lòng thử lại sau!';
                    return;
                }
                loadingDiv.innerHTML = formatBotReply(data.reply || "Không có phản hồi từ AI");
            } catch (error) {
                loadingDiv.innerText = 'Có lỗi xảy ra, vui lòng thử lại sau!';
            } finally {
                window.clearTimeout(timeoutId);
                sendBtn.disabled = false;
            }
        }

        async function resetConversation() {
            try {
                const response = await fetch('/api/chat/reset', { method: 'POST' });
                if (!response.ok) throw new Error('Chat reset failed');
                messages.replaceChildren();
                appendMessage('Xin chào! Tôi là trợ lý AI của Lapzone. Bạn cần tìm mua laptop gaming hay văn phòng?', 'bot');
            } catch (error) {
                appendMessage('Không thể làm mới cuộc trò chuyện, vui lòng thử lại.', 'bot');
            }
        }

        // Bắt sự kiện click nút Gửi & ấn phím Enter
        sendBtn.addEventListener("click", sendMessage);
        input.addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMessage();
        });

        // Hàm hỗ trợ vẽ tin nhắn lên giao diện
        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.style.padding = '10px 15px';
            msgDiv.style.borderRadius = '15px';
            msgDiv.style.marginBottom = '10px';
            msgDiv.style.fontSize = '14px';
            msgDiv.style.maxWidth = '85%';
            msgDiv.style.lineHeight = '1.4';
            msgDiv.style.wordBreak = 'break-word';

            if (sender === 'user') {
                msgDiv.style.background = '#0b5ed7';
                msgDiv.style.color = 'white';
                msgDiv.style.marginLeft = 'auto';
            } else {
                msgDiv.style.background = '#e9ecef';
                msgDiv.style.color = '#333';
            }

            msgDiv.innerText = text;
            messages.appendChild(msgDiv);
            messages.scrollTop = messages.scrollHeight;
            return msgDiv;
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }

        function formatBotReply(text) {
            const lines = escapeHtml(String(text)).split(/\r?\n/);
            const output = [];
            let inList = false;
            for (const line of lines) {
                const item = line.match(/^\s*[-*]\s+(.+)$/);
                if (item) {
                    if (!inList) {
                        output.push('<ul class="chatbot-list">');
                        inList = true;
                    }
                    output.push('<li>' + formatInline(item[1]) + '</li>');
                } else {
                    if (inList) {
                        output.push('</ul>');
                        inList = false;
                    }
                    if (line) output.push(formatInline(line));
                    output.push('<br>');
                }
            }
            if (inList) output.push('</ul>');
            return output.join('');
        }

        function formatInline(text) {
            return text
                .replace(/\/product_detail\?id=(\d+)/g,
                    '<a class="chatbot-link" href="/product_detail?id=$1" target="_blank" rel="noopener">Xem chi tiết</a>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        }
    });
</script>
</div>

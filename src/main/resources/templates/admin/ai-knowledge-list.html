<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:fragment="knowledgeHead(pageTitle)">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle != null ? pageTitle : 'Kiến thức AI | LAPZONE'}">Kiến thức AI | LAPZONE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style th:replace="~{admin/ai-dashboard :: style}"></style>
</head>
<body>
<div th:replace="~{admin/sidebar :: adminSidebar}"></div>
<main class="main-content">
    <a th:href="@{/admin/ai}" class="btn btn-outline-primary mb-3">← Quản lý Chatbot AI</a>
    <div class="d-flex flex-wrap gap-3 align-items-center justify-content-between mb-3">
        <h1 class="h3 m-0">Kiến thức AI</h1><a class="btn btn-primary" th:href="@{/admin/ai/knowledge/new}">Tạo kiến thức mới</a>
    </div>
    <p class="text-muted">Chỉ phiên bản đã kiểm tra và xuất bản được dùng để trả lời. Sửa bản nháp không thay đổi bản đang xuất bản.</p>
    <section class="panel">
        <div class="table-responsive"><table class="table align-middle">
            <thead><tr><th>Tiêu đề</th><th>Danh mục</th><th>Trạng thái</th><th>Phiên bản</th><th>Quản lý</th></tr></thead>
            <tbody><tr th:each="entry : ${entries.content}">
                <td th:text="${entry.title}"></td><td th:text="${entry.categoryLabel}"></td><td th:text="${entry.state.label}"></td>
                <td><span th:text="|Mới nhất: ${entry.currentVersion}|"></span><br>
                    <small th:text="${entry.publishedVersion == null ? 'Chưa xuất bản' : 'Đang dùng: ' + entry.publishedVersion}"></small></td>
                <td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/ai/knowledge/{id}(id=${entry.id})}">Mở mục</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/ai/knowledge/{id}/history(id=${entry.id})}">Lịch sử</a></td>
            </tr><tr th:if="${entries.empty}"><td colspan="5">Chưa có mục kiến thức nào.</td></tr></tbody>
        </table></div>
        <nav class="d-flex justify-content-between align-items-center" aria-label="Trang kiến thức">
            <a th:if="${entries.hasPrevious()}" th:href="@{/admin/ai/knowledge(page=${entries.number - 1})}">Trước</a><span th:unless="${entries.hasPrevious()}"></span>
            <span th:text="${'Trang ' + (entries.number + 1) + ' / ' + (entries.totalPages == 0 ? 1 : entries.totalPages)}"></span>
            <a th:if="${entries.hasNext()}" th:href="@{/admin/ai/knowledge(page=${entries.number + 1})}">Sau</a><span th:unless="${entries.hasNext()}"></span>
        </nav>
    </section>
</main></body></html>

# Copy these settings into application-local.properties in the project root.
# Replace both placeholders with your Gmail address and a Gmail App Password.
MAIL_USERNAME=your-email@gmail.com
MAIL_PASSWORD=YOUR_GMAIL_APP_PASSWORD

# Set GEMINI_API_KEY in the environment; never put a real API key in this file.
gemini.api.key=${GEMINI_API_KEY:}
app.ai.model=gemini-3.1-flash-lite
app.ai.fallback-model=gemini-flash-lite-latest
app.ai.read-timeout-seconds=15
app.ai.total-deadline-seconds=25

# Keep false for normal use. Set true only for offline development/testing.
app.otp.log-to-console=false
